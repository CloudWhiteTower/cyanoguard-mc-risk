name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.11
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python -m pip install --no-deps --no-index --find-links dist mc-risk-predictor==1.0.0
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/smoke_installed.py
