name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Set Linux virtual environment path
        if: runner.os == 'Linux'
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Set Windows virtual environment path
        if: runner.os == 'Windows'
        shell: pwsh
        run: "$PWD\.venv\Scripts" >> $env:GITHUB_PATH
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python -m pip install --no-deps --no-index --find-links dist mc-risk-predictor==1.0.0
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/smoke_installed.py
